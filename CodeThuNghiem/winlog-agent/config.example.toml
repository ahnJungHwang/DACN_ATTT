# Copy to config.local.toml; this file contains no secrets.
data_root = "data"
bind_mode = "local"
host = "127.0.0.1"
port = 8000
workers = 1
ollama_url = "http://127.0.0.1:11434"
allowed_models = ["qwen2.5:3b-instruct-q4_K_M", "llama3.2:3b-instruct-q4_K_M"]
failure_window_seconds = 60
success_window_seconds = 300
activity_window_seconds = 300
failure_threshold = 5
inference_timeout_seconds = 300
response_wait_seconds = 10
queue_capacity = 20
upload_max_bytes = 52428800
import_max_events = 100000
xml_max_depth = 32
temperature = 0.0
num_ctx = 4096
num_predict = 512
context_reserve = 256

